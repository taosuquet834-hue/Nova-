<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova — Explorateur</title>
<style>
  :root{--bg:#0f1412;--panel:#18201c;--line:#2a3630;--text:#e8efe9;--muted:#93a39a;--accent:#9be37a;--warn:#f0b36a}
  @media (prefers-color-scheme: light){:root{--bg:#f4f7f4;--panel:#fff;--line:#d9e2dc;--text:#14201a;--muted:#5d6e64;--accent:#2f7d1d;--warn:#a35d00}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
  .shell{max-width:980px;margin:0 auto;padding:24px 16px}
  header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
  header a.brand{color:var(--accent);font-weight:700;text-decoration:none;font-size:18px}
  form{flex:1;display:flex;gap:8px;min-width:240px}
  input{flex:1;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}
  button{background:var(--accent);color:#102010;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;overflow-x:auto}
  h1,h2{margin:0 0 12px;font-size:17px}
  table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:13px}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  code{font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .muted{color:var(--muted)}.err{color:var(--warn)}.grid{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px}
  .grid dt{color:var(--muted)}.grid dd{margin:0;word-break:break-all}
  .badge{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--muted)}
  @media(max-width:600px){.shell{padding:16px}}
</style>
</head>
<body>
<div class="shell">
  <header><a class="brand" href="#/">✳ Nova · Explorateur</a>
    <form id="search"><input id="q" placeholder="Hauteur, empreinte de bloc, transaction ou adresse" aria-label="Recherche" autocomplete="off"><button>Chercher</button></form></header>
  <main id="view"></main>
  <p class="muted">Réseau d'essai sans valeur monétaire · données lues sur ce nœud · <a href="/">Tableau de bord</a></p>
</div>
<script>
(function(){
  const view=document.getElementById('view');
  const UNIT=100000000;
  const nova=n=>(n===null||n===undefined)?'inconnu':(n/UNIT).toLocaleString('fr-FR',{maximumFractionDigits:8})+' NOVA';
  const when=t=>new Date(t*1000).toLocaleString('fr-FR');
  const short=(h,n=10)=>h.length>2*n+1?h.slice(0,n)+'…'+h.slice(-6):h;
  function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=text;if(cls)e.className=cls;return e;}
  function link(text,href){const a=el('a',text);a.href=href;return a;}
  function panel(title){const p=el('section',undefined,'panel');if(title)p.append(el('h2',title));return p;}
  function dl(rows){const d=el('dl',undefined,'grid');for(const [k,v] of rows){d.append(el('dt',k));const dd=el('dd');if(v instanceof Node)dd.append(v);else dd.textContent=v;d.append(dd);}return d;}
  function table(head,rows){const t=el('table'),tr=el('tr');for(const h of head)tr.append(el('th',h));t.append(tr);
    for(const r of rows){const row=el('tr');for(const c of r){const td=el('td');if(c instanceof Node)td.append(c);else td.textContent=c;row.append(td);}t.append(row);}return t;}
  async function get(path){const r=await fetch(path);const d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur');return d;}
  const blockLink=h=>link('#'+h,'#/block/'+h);
  const txLink=t=>{const a=link(short(t),'#/tx/'+t);a.title=t;return a;};
  const addrLink=a=>{if(!a)return el('span','—','muted');const l=link(short(a,12),'#/address/'+a);l.title=a;return l;};

  async function home(){
    const data=await get('/api/explorer/blocks?limit=20');
    const p=panel('Derniers blocs · hauteur '+data.height);
    p.append(table(['Bloc','Empreinte','Heure','Transactions','Taille (o)','Difficulté'],
      data.blocks.map(b=>[blockLink(b.height),el('code',short(b.hash)),when(b.timestamp),b.tx_count,b.size,b.difficulty_bits+' bits'])));
    view.replaceChildren(p);
  }
  async function block(key){
    const b=await get('/api/explorer/block?key='+encodeURIComponent(key));
    const p=panel('Bloc #'+b.height);
    const prev=b.height>0?link(short(b.previous),'#/block/'+b.previous):el('span','aucun (genesis)','muted');
    p.append(dl([['Empreinte',b.hash],['Précédent',prev],['Suivant',b.next?link(short(b.next),'#/block/'+b.next):el('span','pas encore','muted')],
      ['Heure',when(b.timestamp)],['Confirmations',String(b.confirmations)],['Difficulté',b.difficulty_bits+' bits'],['Nonce',String(b.nonce)],
      ['Racine de Merkle',b.merkle_root],['Taille',b.size+' octets'],['Mineur',b.miner?addrLink(b.miner):'—'],['Récompense',nova(b.reward)],['Frais',nova(b.fees)]]));
    const t=panel('Transactions ('+b.tx_count+')');
    t.append(table(['Identifiant','Type','Entrées','Sorties','Total','Frais'],
      b.transactions.map(x=>[txLink(x.txid),x.coinbase?'Récompense':'Paiement',x.inputs.length,x.outputs.length,nova(x.total_out),x.coinbase?'—':nova(x.fee)])));
    view.replaceChildren(p,t);
  }
  async function tx(id){
    const x=await get('/api/explorer/tx?id='+encodeURIComponent(id));
    const p=panel('Transaction');
    p.append(dl([['Identifiant',x.txid],['État',x.confirmed?'Confirmée ('+x.confirmations+' confirmations)':'En attente d’un bloc'],
      ['Bloc',x.confirmed?link('#'+x.height,'#/block/'+x.height):'—'],['Type',x.coinbase?'Récompense de minage':'Paiement'],
      ['Total envoyé',nova(x.total_out)],['Frais',x.coinbase?'—':nova(x.fee)]]));
    const i=panel('Entrées');
    i.append(x.coinbase?el('p','Création de pièces (récompense du bloc).','muted'):table(['Pièce','Adresse','Montant'],
      x.inputs.map(n=>[el('code',short(n.txid)+':'+n.index),addrLink(n.address),nova(n.amount)])));
    const o=panel('Sorties');
    o.append(table(['#','Adresse','Montant'],x.outputs.map((n,k)=>[k,addrLink(n.address),nova(n.amount)])));
    view.replaceChildren(p,i,o);
  }
  async function address(a){
    const x=await get('/api/explorer/address?address='+encodeURIComponent(a));
    const p=panel('Adresse');
    p.append(dl([['Adresse',x.address],['Solde confirmé',nova(x.confirmed)],['Disponible',nova(x.available)],['Total reçu',nova(x.received)],['Total envoyé',nova(x.sent)],['Mouvements',String(x.events)]]));
    const h=panel('Historique (les plus récents d’abord)');
    h.append(x.history.length?table(['Bloc','Transaction','Reçu','Envoyé'],x.history.map(e=>[blockLink(e.height),txLink(e.txid),e.received?nova(e.received):'—',e.sent?nova(e.sent):'—'])):el('p','Aucun mouvement connu.','muted'));
    view.replaceChildren(p,h);
  }
  async function route(){
    const parts=location.hash.replace(/^#\/?/,'').split('/');
    try{
      if(!parts[0])await home();
      else if(parts[0]==='block')await block(decodeURIComponent(parts[1]));
      else if(parts[0]==='tx')await tx(parts[1]);
      else if(parts[0]==='address')await address(parts[1]);
      else await home();
    }catch(e){const p=panel();p.append(el('p',e.message,'err'),link('Retour à l’accueil','#/'));view.replaceChildren(p);}
  }
  document.getElementById('search').addEventListener('submit',async ev=>{
    ev.preventDefault();const q=document.getElementById('q').value;if(!q.trim())return;
    try{const r=await get('/api/explorer/search?q='+encodeURIComponent(q));location.hash='#/'+r.type+'/'+r.key;}
    catch(e){const p=panel();p.append(el('p',e.message,'err'));view.replaceChildren(p);}
  });
  window.addEventListener('hashchange',route);route();setInterval(()=>{if(!location.hash||location.hash==='#/')route();},5000);
})();
</script>
</body>
</html>
