[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-testchain"
version = "1.3.0rc1"
description = "An independent educational proof-of-work test network"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nova = "novacoin.cli:main"

[tool.setuptools]
packages = ["novacoin"]

[tool.setuptools.package-data]
novacoin = ["dashboard.html", "explorer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
